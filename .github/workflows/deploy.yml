name: Deploy Lily Blog
on:
  push:
    branches: [main]
  workflow_dispatch:
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.issue.body, '<!-- lily-blog:') &&
      (github.event.issue.user.login == 'github-actions[bot]' || github.event.issue.user.login == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload static site
        uses: withastro/action@v6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          node-version: 24
          package-manager: pnpm@11.25.0
          build-cmd: pnpm build && node scripts/sync-comments.mjs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
